# KAI Unlearning - EKFAC Influence Label-Based Final Configuration
# Uses the tuned hyperparameters, trains/evaluates with no validation holdout, and opens test metrics.

seed: 42
device: cuda
cuda_visible_devices: "0"
num_workers: 4
pin_memory: false

data_dir: ./data
checkpoint_dir: ./runs/ekfac_label_based_final
baseline_checkpoint: ./checkpoints/baseline_final/trained_model.pth
log_dir: ./logs

data:
  name: cifar10
  split_strategy: label_based
  forget_labels: [4]
  forget_ratio: 0.1
  val_ratio: 0

model:
  name: resnet18
  pretrained: false
  num_classes: 10

training:
  epochs: 100
  batch_size: 64
  learning_rate: 0.1
  momentum: 0.9
  weight_decay: 5e-4
  scheduler:
    name: cosine
    warmup_epochs: 1
  optimizer:
    name: sgd

unlearning:
  name: ekfac_influence
  fisher_batch_size: 250
  step_size: 0.007
  damping: 0.05
  num_unlearn_steps: 3
  step_size_schedule: [0.004, 0.0015, 0.0007]
  recompute_curvature_each_step: true
  unlearn_eval_interval: 0
  max_eval_batches: null
  max_curvature_batches: null
  max_forget_batches: null

evaluation:
  protocol: final
  batch_size: 250
  use_test_during_unlearn: false
  use_test_during_retrain: false
  enable_visualizations: true
  metrics:
    - accuracy
    - forget_quality
    - model_utility

wandb:
  project: kai-unlearning_v4
  entity: null
  run_name_base: CIFAR10-ResNet18-EKFACInfluence-LabelBased-Class4-Final
  mode: online

logging:
  level: INFO
  log_to_file: true
  rich_formatting: true
