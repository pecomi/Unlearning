# KAI Unlearning - Final Baseline Configuration
# Trains the final baseline on the full CIFAR train split after tuning is fixed.

seed: 42
device: cuda
cuda_visible_devices: "0"
num_workers: 0
pin_memory: false

data_dir: ./data
checkpoint_dir: ./checkpoints/baseline_final
log_dir: ./logs

data:
  name: cifar10
  split_strategy: label_based
  forget_labels: [4]
  forget_ratio: 0.1
  val_ratio: 0

model:
  name: resnet18
  pretrained: false
  num_classes: 10

training:
  epochs: 100
  batch_size: 64
  learning_rate: 0.1
  momentum: 0.9
  weight_decay: 5e-4
  scheduler:
    name: cosine
    warmup_epochs: 1
  optimizer:
    name: sgd

unlearning:
  name: ssd
  dampening_constant: 1.0
  selection_weighting: 10.0
  fisher_batch_size: 8

evaluation:
  protocol: final
  batch_size: 128
  use_test_during_unlearn: false
  use_test_during_retrain: false
  enable_visualizations: true
  metrics:
    - accuracy
    - forget_quality
    - model_utility

wandb:
  project: kai-unlearning_v4
  entity: null
  run_name_base: CIFAR10-ResNet18-Baseline-Final
  mode: online

logging:
  level: INFO
  log_to_file: true
  rich_formatting: true
