# KAI Unlearning - Random Sample Forgetting Configuration
# Forgets a random 10% subset of training data

# Global Settings
seed: 42
device: cuda
cuda_visible_devices: "5"
num_workers: 4
pin_memory: false

# Project Paths
data_dir: ./data
checkpoint_dir: ./runs/random  # Task-specific output directory
baseline_checkpoint: ./checkpoints/baseline/trained_model.pth  # Shared baseline
log_dir: ./logs

# Data Configuration
data:
  name: cifar10
  split_strategy: random  # Random sample forgetting
  forget_labels: null
  forget_ratio: 0.1  # Forget 10% of training data
  val_ratio: 0.1

# Model Configuration
model:
  name: resnet18
  pretrained: false
  num_classes: 10

# Training Configuration (for retrain mode)
training:
  epochs: 100
  batch_size: 64
  learning_rate: 0.1
  momentum: 0.9
  weight_decay: 5e-4
  scheduler:
    name: cosine
    warmup_epochs: 1
  optimizer:
    name: sgd

# Unlearning Configuration (SSD)
unlearning:
  name: ssd
  dampening_constant: 1.0  # Lambda parameter in SSD
  selection_weighting: 5.0  # Alpha parameter for synapse selection threshold
  fisher_batch_size: 8  # Batch size for Fisher (importance) computation; paper/official repo default

# Evaluation Configuration
evaluation:
  protocol: tuning
  batch_size: 128
  use_test_during_unlearn: false
  use_test_during_retrain: false
  enable_visualizations: false
  metrics:
    - accuracy
    - forget_quality
    - model_utility

# Wandb Configuration
wandb:
  project: kai-unlearning_v4
  entity: null
  run_name_base: CIFAR10-ResNet18-SSD-Random10  # Base name, mode suffix will be added
  mode: online

# Logging Configuration
logging:
  level: INFO
  log_to_file: true
  rich_formatting: true
