# KAI Unlearning - EKFAC Influence Random Final Configuration

seed: 42
device: cuda
cuda_visible_devices: "0"
num_workers: 4
pin_memory: false

data_dir: ./data
checkpoint_dir: ./runs/ekfac_random_final
baseline_checkpoint: ./checkpoints/baseline_final/trained_model.pth

data:
  name: cifar10
  split_strategy: random
  forget_labels: null
  forget_ratio: 0.1
  val_ratio: 0

model:
  name: resnet18
  pretrained: false
  num_classes: 10

training:
  enable_validation: false
  epochs: 100
  batch_size: 64
  scheduler:
    name: cosine
  optimizer:
    name: sgd
    learning_rate: 0.1
    momentum: 0.9
    weight_decay: 5e-4

unlearning:
  name: ekfac_influence
  fisher_batch_size: 128
  # Retune after the scale correction below; 1.0 is the Newton-style reference.
  correction_strength: 1.0
  damping_ratio: 0.1
  damping_floor: 1.0e-8
  regularization_curvature: 5.0e-4
  update_unsupported_params: false
  num_unlearn_steps: 1
  recompute_curvature_each_step: true
  unlearn_eval_interval: 0
  max_eval_batches: null
  max_curvature_batches: null
  max_forget_batches: null
  forget_update_mode: full_batch

evaluation:
  protocol: final
  batch_size: 128
  enable_visualizations: true
  metrics:
    - accuracy
    - forget_quality
    - model_utility

wandb:
  project: kai-unlearning_v4
  entity: null
  run_name_base: CIFAR10-ResNet18-EKFACInfluence-Random10-Final
  mode: online

logging:
  level: INFO
